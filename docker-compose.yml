services:
  portal-client:
    image: portal-client:latest
    container_name: portal-client
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - /usr/share/zoneinfo/America/Los_Angeles:/etc/localtime:ro
    healthcheck:
      test: [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "-O",
          "/dev/null",
          # 127.0.0.1, not localhost: busybox wget may resolve localhost to
          # ::1, and Next listens on IPv4 (HOSTNAME=0.0.0.0) — same probe as
          # the Dockerfile HEALTHCHECK this overrides.
          "http://127.0.0.1:4000/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
